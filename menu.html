<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Metodo Vittoria</title>

<link rel="stylesheet" href="CSS/style.css">

<style>

body{
    background:#f7dce5;
}

.menu{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:30px;

}

.top-bar{

    width:100%;

    display:flex;

    justify-content:flex-end;

    margin-bottom:50px;

}

.settings{

    font-size:34px;

    cursor:pointer;

}

h1{

    font-size:58px;

    color:#972b82;

    margin-bottom:15px;

}

h2{

    font-size:26px;

    color:#8b6f94;

    margin-bottom:45px;

    font-weight:normal;

    text-align:center;

}

.menu-card{

    width:100%;

    max-width:420px;

    background:white;

    border-radius:28px;

    padding:28px;

    margin-bottom:25px;

    text-decoration:none;

    color:#333;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

    transition:.2s;

}

.menu-card:hover{

    transform:translateY(-4px);

}

.icon{

    font-size:52px;

    margin-bottom:15px;

}

.card-title{

    font-size:32px;

    font-weight:bold;

    color:#972b82;

    margin-bottom:10px;

}

.card-description{

    font-size:20px;

    color:#666;

    line-height:1.4;

}

</style>

</head>

<body>

<div class="menu">

<div class="top-bar">
<div class="settings">⚙️</div>
</div>

<h1>Ciao, Vittoria!</h1>

<h2>Cosa vuoi fare oggi?</h2>

<a href="#" class="menu-card">

<div class="icon">📷</div>

<div class="card-title">
Ho una pagina del libro
</div>

<div class="card-description">
Scatta una foto e ti aiuterò a capire, riassumere e studiare la pagina.
</div>

</a>

<a href="scegli-materia.html" class="menu-card">

<div class="icon">📚</div>

<div class="card-title">
Ripassa una materia
</div>

<div class="card-description">
Scegli la materia e ripassa con riassunti, immagini e quiz.
</div>

</a>

</div>

</body>
</html>
