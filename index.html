<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Metodo Vittoria</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#972b82">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f7dce5;
}

.welcome{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

.logo{
    font-size:80px;
    margin-bottom:20px;
}

h1{
    color:#972b82;
    font-size:60px;
    margin-bottom:10px;
    font-weight:800;
}

.subtitle{
    color:#6f5a67;
    font-size:22px;
    margin-bottom:50px;
}

.button-style{

    width:100%;
    max-width:340px;

    padding:22px;

    background:white;

    color:#972b82;

    text-decoration:none;

    font-size:30px;

    font-weight:bold;

    border-radius:22px;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

    transition:.2s;

}

.button-style:hover{
    transform:scale(1.03);
}

.button-style:active{
    transform:scale(.98);
}

</style>

</head>

<body>

<div class="welcome">

<div class="logo">💗</div>

<h1>Metodo Vittoria</h1>

<div class="subtitle">
Studiare può essere più semplice.
</div>

<a href="menu.html" class="button-style">
Cominciamo
</a>

</div>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("Service Worker registrato!"))
        .catch(err => console.log(err));
}
</script>

</body>
</html>
