<h1>🇬🇧 INGLESE</h1>
<h2>WAS / WERE</h2>

<p class="page-subtitle">
Domande con il verbo "to be" al passato.
</p>

<section class="lesson-section">

<h2>📖 Regola</h2>

<p>Was + I / He / She / It</p>

<p>Were + You / We / They</p>

</section>

<section class="lesson-section">

<h2>💬 Esempi</h2>

<p>Was he at home?</p>

<p>Were they happy?</p>

<p>Were you tired?</p>

</section>

<section class="lesson-section">

<h2>⭐ Da ricordare</h2>

<ul>
<li>Was si usa con I, He, She, It.</li>
<li>Were si usa con You, We, They.</li>
</ul>

</section>
